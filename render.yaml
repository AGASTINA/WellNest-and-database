services:
  - type: web
    name: wellnest-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_HOST
        fromDatabase:
          name: wellnest-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: wellnest-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: wellnest-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: wellnest-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: wellnest-db
          property: password
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: wellnest-frontend
          property: host
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: wellnest-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: wellnest-api
          property: host

databases:
  - name: wellnest-db
    databaseName: wellnest
    user: wellnest
    region: singapore
    plan: free
